<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 608" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="608" fill="none"/>

  <g>
    <rect x="60" y="16" width="600" height="96" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="360" y="50" text-anchor="middle" font-size="21" font-weight="700" fill="#14467c">1. 选领域模板</text>
    <text x="360" y="78" text-anchor="middle" font-size="16" fill="#33424f">自带数据结构与整套页面</text>
    <text x="360" y="100" text-anchor="middle" font-size="16" fill="#33424f">也可从空白开始自由搭建</text>
  </g>
  <line x1="360" y1="112" x2="360" y2="134" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="60" y="136" width="600" height="96" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="360" y="170" text-anchor="middle" font-size="21" font-weight="700" fill="#14467c">2. 按业务调整</text>
    <text x="360" y="198" text-anchor="middle" font-size="16" fill="#33424f">加字段、改页面</text>
    <text x="360" y="220" text-anchor="middle" font-size="16" fill="#33424f">调审批流程和权限</text>
  </g>
  <line x1="360" y1="232" x2="360" y2="254" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="60" y="256" width="600" height="96" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="360" y="290" text-anchor="middle" font-size="21" font-weight="700" fill="#14467c">3. 发布</text>
    <text x="360" y="318" text-anchor="middle" font-size="16" fill="#33424f">草稿确认无误即刻上线</text>
    <text x="360" y="340" text-anchor="middle" font-size="16" fill="#33424f">可回滚到任何历史版本</text>
  </g>
  <line x1="360" y1="352" x2="360" y2="374" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="60" y="376" width="600" height="96" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="360" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#14467c">4. 投入使用</text>
    <text x="360" y="438" text-anchor="middle" font-size="16" fill="#33424f">员工办业务、走审批</text>
    <text x="360" y="460" text-anchor="middle" font-size="16" fill="#33424f">会员与访客对外访问</text>
  </g>
  <line x1="360" y1="472" x2="360" y2="494" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="60" y="496" width="600" height="96" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="360" y="530" text-anchor="middle" font-size="21" font-weight="700" fill="#14467c">5. 日常运营</text>
    <text x="360" y="558" text-anchor="middle" font-size="16" fill="#33424f">管理台看数据、管人员</text>
    <text x="360" y="580" text-anchor="middle" font-size="16" fill="#33424f">AI 运营助手汇总分析</text>
  </g>
</svg>
