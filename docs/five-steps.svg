<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 176" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/>
    </marker>
  </defs>

  <g>
    <rect x="0" y="25" width="224" height="126" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="112" y="63" text-anchor="middle" font-size="20" font-weight="700" fill="#14467c">1. 选领域模板</text>
    <text x="112" y="95" text-anchor="middle" font-size="15" fill="#33424f">自带数据结构与整套页面</text>
    <text x="112" y="119" text-anchor="middle" font-size="15" fill="#33424f">也可从空白开始自由搭建</text>
  </g>
  <line x1="228" y1="88" x2="258" y2="88" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="264" y="25" width="224" height="126" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="376" y="63" text-anchor="middle" font-size="20" font-weight="700" fill="#14467c">2. 按业务调整</text>
    <text x="376" y="95" text-anchor="middle" font-size="15" fill="#33424f">加字段、改页面</text>
    <text x="376" y="119" text-anchor="middle" font-size="15" fill="#33424f">调审批流程和权限</text>
  </g>
  <line x1="492" y1="88" x2="522" y2="88" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="528" y="25" width="224" height="126" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="640" y="63" text-anchor="middle" font-size="20" font-weight="700" fill="#14467c">3. 发布</text>
    <text x="640" y="95" text-anchor="middle" font-size="15" fill="#33424f">草稿确认无误即刻上线</text>
    <text x="640" y="119" text-anchor="middle" font-size="15" fill="#33424f">可回滚到任何历史版本</text>
  </g>
  <line x1="756" y1="88" x2="786" y2="88" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="792" y="25" width="224" height="126" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="904" y="63" text-anchor="middle" font-size="20" font-weight="700" fill="#14467c">4. 投入使用</text>
    <text x="904" y="95" text-anchor="middle" font-size="15" fill="#33424f">员工办业务、走审批</text>
    <text x="904" y="119" text-anchor="middle" font-size="15" fill="#33424f">会员与访客对外访问</text>
  </g>
  <line x1="1020" y1="88" x2="1050" y2="88" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="1056" y="25" width="224" height="126" rx="12" fill="#f2f6ff" stroke="#3b82c4" stroke-width="1.5"/>
    <text x="1168" y="63" text-anchor="middle" font-size="20" font-weight="700" fill="#14467c">5. 日常运营</text>
    <text x="1168" y="95" text-anchor="middle" font-size="15" fill="#33424f">管理台看数据、管人员</text>
    <text x="1168" y="119" text-anchor="middle" font-size="15" fill="#33424f">AI 运营助手汇总分析</text>
  </g>
</svg>
